name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

# Necessário para o passo de auto-bump conseguir commitar o build-number.txt de volta.
permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # fetch-depth: 0 traz todo o histórico — sem isso, 'git rev-list --count HEAD'
          # retornaria 1 (clone raso) e o número de versão ficaria errado.
          fetch-depth: 0

      # Sem 'cache: npm' nem 'cache-dependency-path': o projeto NÃO tem package-lock.json,
      # então a cache do npm falharia logo de cara (era a causa do CI vermelho em ~15s).
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # npm install (não 'npm ci', que exige lock file inexistente).
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Build frontend
        working-directory: frontend
        env:
          # CI=true faz o CRA/craco tratar warning de ESLint como erro e quebrar o build.
          CI: 'false'
        run: npm run build

      - name: Validate backend syntax
        run: python -m compileall backend

      # Auto-bump do número de versão: grava o total de commits em build-number.txt
      # e commita de volta com [skip ci] (não dispara novo CI). Como build-number.txt é
      # arquivo do frontend, o push faz o Railway rebuildar o front com o número novo.
      # Roda só em push na main e só depois do build passar. continue-on-error: não
      # bloqueia o deploy se o push do bump falhar (ex.: falta permissão de escrita).
      - name: Bump build number
        # always(): roda mesmo se um passo anterior falhar, pra a versão não ficar
        # refém de um warning de build. Só em push na main.
        if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        run: |
          COUNT=$(git rev-list --count HEAD)
          echo "$COUNT" > frontend/build-number.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/build-number.txt
          if git diff --cached --quiet; then
            echo "build-number.txt ja esta em $COUNT - nada a commitar."
            exit 0
          fi
          git commit -m "chore(build): build-number $COUNT [skip ci]"
          git push origin HEAD:main
